<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inmovilizador Moto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .status-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid #334155;
    }
    .status-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .status-value {
      font-size: 1.125rem;
      font-weight: bold;
      margin-top: 4px;
      color: #ef4444;
    }
    .status-value.connected {
      color: #22c55e;
    }
    .btn {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-bluetooth {
      background-color: #2563eb;
      color: white;
    }
    .btn-unlock {
      background-color: #16a34a;
      color: white;
    }
    .btn-lock {
      background-color: #dc2626;
      color: white;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .log-box {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #64748b;
      background: #090d16;
      border-radius: 8px;
      padding: 10px;
      max-height: 80px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Inmovilizador Moto</h1>
    <p class="subtitle">Control Web Bluetooth ESP32</p>

    <div class="status-box">
      <div class="status-label">Estado de Conexión</div>
      <div id="status" class="status-value">Desconectado</div>
    </div>

    <button id="connectBtn" class="btn btn-bluetooth" onclick="connectBT()">
      🔗 Conectar Bluetooth
    </button>

    <button id="unlockBtn" class="btn btn-unlock" onclick="sendCommand('1')" disabled>
      🔓 DESBLOQUEAR / ENCENDER
    </button>

    <button id="lockBtn" class="btn btn-lock" onclick="sendCommand('0')" disabled>
      🔒 BLOQUEAR / INMOVILIZAR
    </button>

    <div id="log" class="log-box">> Listo para conectar...</div>
  </div>

  <script>
    // UUIDs de Bluetooth (puedes cambiarlos si tu sketch de ESP32 usa otros específicos)
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    let bluetoothDevice = null;
    let gattCharacteristic = null;

    function log(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<br>> ${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function connectBT() {
      try {
        log('Buscando dispositivo Bluetooth...');
        
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log(`Conectando a: ${bluetoothDevice.name || 'ESP32'}...`);
        const server = await bluetoothDevice.gatt.connect();

        log('Obteniendo servicio...');
        const service = await server.getPrimaryService(SERVICE_UUID);

        log('Obteniendo característica...');
        gattCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById('status').innerText = 'Conectado';
        document.getElementById('status').classList.add('connected');
        document.getElementById('unlockBtn').disabled = false;
        document.getElementById('lockBtn').disabled = false;
        document.getElementById('connectBtn').innerText = '🔌 Desconectar';
        document.getElementById('connectBtn').onclick = disconnectBT;

        log('¡Conexión establecida!');
      } catch (error) {
        log(`Error: ${error.message || error}`);
      }
    }

    async function sendCommand(cmd) {
      if (!gattCharacteristic) {
        log('No hay conexión Bluetooth.');
        return;
      }
      try {
        const encoder = new TextEncoder();
        await gattCharacteristic.writeValue(encoder.encode(cmd));
        log(`Comando enviado: ${cmd === '1' ? 'DESBLOQUEAR (1)' : 'BLOQUEAR (0)'}`);
      } catch (error) {
        log(`Error al enviar comando: ${error.message}`);
      }
    }

    function disconnectBT() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      log('Dispositivo desconectado.');
      document.getElementById('status').innerText = 'Desconectado';
      document.getElementById('status').classList.remove('connected');
      document.getElementById('unlockBtn').disabled = true;
      document.getElementById('lockBtn').disabled = true;
      document.getElementById('connectBtn').innerText = '🔗 Conectar Bluetooth';
      document.getElementById('connectBtn').onclick = connectBT;
    }
  </script>
</body>
</html>
